[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ranglerpy"
version = "0.1.0"
description = "Python SDK for the Atlas (Rangler) API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Atlas" }
]
dependencies = [
  "httpx>=0.27,<1.0",
]
keywords = ["atlas", "rangler", "api", "events", "webhooks", "filings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Documentation = "https://docs.rangler.co/docs/sdks"
Homepage = "https://docs.rangler.co/docs"
Repository = "https://github.com/smyja/rangler-python"
Issues = "https://github.com/smyja/rangler-python/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ranglerpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
